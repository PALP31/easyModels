<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <radialGradient id="glowTopRight" cx="85%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#00e5bc" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00e5bc" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBottomLeft" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0" />
    </radialGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="subtleGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="1200" height="340" fill="url(#subtleGrid)" />
  <rect width="1200" height="340" fill="url(#glowTopRight)" />
  <rect width="1200" height="340" fill="url(#glowBottomLeft)" />

  <!-- Accent Border Top Line -->
  <rect x="0" y="0" width="1200" height="3" fill="#00e5bc" />

  <!-- Geometric Illustration Right Side -->
  <g transform="translate(980, 170)">
    <circle cx="0" cy="0" r="90" fill="none" stroke="#00e5bc" stroke-opacity="0.1" stroke-width="2" />
    <circle cx="0" cy="0" r="65" fill="none" stroke="#00e5bc" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6,6" />
    <circle cx="0" cy="0" r="42" fill="#00e5bc" fill-opacity="0.08" stroke="#00e5bc" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="0" cy="0" r="16" fill="#00e5bc" fill-opacity="0.3" filter="url(#iconGlow)" />
    <text x="0" y="10" text-anchor="middle" font-size="34">📦</text>
  </g>

  <!-- Left Content -->
  <!-- Category Tag -->
  <g transform="translate(60, 52)">
    <rect x="0" y="0" width="286.5" height="24" rx="12" fill="#00e5bc" fill-opacity="0.12" stroke="#00e5bc" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#00e5bc" />
    <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#00e5bc" letter-spacing="1">R PACKAGE FOR APPLIED BIOSTATISTICS</text>
  </g>

  <!-- Title -->
  <text x="60" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">easyModels (R Package)</text>

  <!-- Subtitle -->
  <text x="60" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="0.2">Automated LM, GLM, LMM & GLMM Fitting, Assumption Auditing, and Publication-Ready Plots</text>

  <!-- Pills -->
  
      <rect x="60" y="248" width="196.5" height="28" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#00e5bc" stroke-opacity="0.3" stroke-width="1"/>
      <text x="158.25" y="266" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">S3 Unified Architecture</text>
        
      <rect x="268.5" y="248" width="151.5" height="28" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#00e5bc" stroke-opacity="0.3" stroke-width="1"/>
      <text x="344.25" y="266" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Box-Cox Assistant</text>
        
      <rect x="432.0" y="248" width="159.0" height="28" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#00e5bc" stroke-opacity="0.3" stroke-width="1"/>
      <text x="511.5" y="266" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">DHARMa Diagnostics</text>
        
      <rect x="603.0" y="248" width="159.0" height="28" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#00e5bc" stroke-opacity="0.3" stroke-width="1"/>
      <text x="682.5" y="266" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Tukey CLD Plotting</text>
        

  <!-- Footer Tagline -->
  <text x="60" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#64748b">Pontificia Universidad Católica de Chile • Paúl Alexander López Peña</text>
